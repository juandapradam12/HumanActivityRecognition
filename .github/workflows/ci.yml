name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r requirements.txt

      - name: Download official UCI files if missing
        run: python scripts/download_data.py

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Pytest
        run: pytest -q --maxfail=1

      - name: Quick official benchmark
        run: python scripts/run_benchmark.py --protocol official --quick --skip-custom-knn
