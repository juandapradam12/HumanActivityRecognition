[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "har-smartphone"
version = "1.3.0"
description = "Human Activity Recognition from smartphone IMU features (UCI HAR)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Educational / research use" }
authors = [{ name = "Juan David Prada Malagon" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0"]
demo = ["streamlit>=1.28"]
deep = ["torch>=2.0", "tqdm>=4.66"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: longer-running evaluation tests",
]
filterwarnings = [
  "ignore::FutureWarning",
]
